<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>帳場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#f3f1ea; --paper2:#e9e5d9; --sink:#dedac9; --rule:#d3cdbc; --hair:#c6bfab;
  --ink:#1e2429; --dim:#6f6a5f;
  --ai:#2d4a76; --ai-bg:#e2e6ee;
  --shu:#ab3721; --shu-bg:#f0e2dd;
  --midori:#3a6650;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#16171a; --paper2:#1e2023; --sink:#26282b; --rule:#33353a; --hair:#43464c;
    --ink:#e9e4d8; --dim:#98938a;
    --ai:#93aed8; --ai-bg:#22293a;
    --shu:#e07a60; --shu-bg:#33221e;
    --midori:#7cae91;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#16171a; --paper2:#1e2023; --sink:#26282b; --rule:#33353a; --hair:#43464c;
  --ink:#e9e4d8; --dim:#98938a;
  --ai:#93aed8; --ai-bg:#22293a;
  --shu:#e07a60; --shu-bg:#33221e;
  --midori:#7cae91;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);
  font-size:15px;line-height:1.72;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom))}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:calc(18px + env(safe-area-inset-top)) 0 14px}
.brand h1{font-family:var(--mincho);font-weight:600;font-size:22px;letter-spacing:.24em;margin:0}
.brand .st{font-size:11.5px;color:var(--dim);letter-spacing:.04em;white-space:nowrap}

.banner{background:var(--shu-bg);color:var(--shu);border-left:3px solid var(--shu);
  padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:14px;border-radius:0 2px 2px 0}
.banner button{color:inherit;text-decoration:underline;font-size:12.5px;margin-left:8px}
.banner.ok{background:var(--ai-bg);color:var(--ai);border-left-color:var(--ai)}

.hero{padding:14px 0 22px;border-bottom:1px solid var(--rule)}
.hero .lbl{font-size:12.5px;letter-spacing:.18em;color:var(--dim)}
.hero .num{font-family:var(--mincho);font-weight:600;line-height:.98;letter-spacing:-.01em;
  display:flex;align-items:baseline;gap:.14em;margin:.12em 0 .1em;font-variant-numeric:tabular-nums}
.hero .num b{font-size:clamp(62px,21vw,92px);font-weight:600}
.hero .num i{font-style:normal;font-size:20px;font-family:var(--gothic);color:var(--dim);letter-spacing:.06em}
.hero .sub{font-size:13.5px;color:var(--dim);letter-spacing:.04em}
.hero.low .num b{color:var(--shu)}
.warn{display:flex;gap:8px;align-items:flex-start;margin-top:14px;color:var(--shu);font-size:13px;line-height:1.65}
.warn::before{content:"";flex:none;width:3px;align-self:stretch;background:var(--shu)}

.facts{display:flex;margin:0;border-bottom:1px solid var(--rule)}
.facts>div{flex:1;padding:14px 0 13px;min-width:0}
.facts>div+div{border-left:1px solid var(--rule);padding-left:14px}
.facts dt{font-size:11px;color:var(--dim);letter-spacing:.02em;line-height:1.45}
.facts dd{margin:2px 0 0;font-family:var(--mincho);font-size:25px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.25}
.facts dd span{font-family:var(--gothic);font-size:12px;font-weight:400;color:var(--dim);margin-left:2px}
.facts dd.sm{font-size:19px}

section{padding:20px 0 4px}
h2{font-family:var(--mincho);font-size:15px;font-weight:600;letter-spacing:.16em;margin:0 0 10px}
h2 .n{font-family:var(--gothic);font-size:11.5px;letter-spacing:.02em;color:var(--dim);font-weight:400;margin-left:8px}
.empty{color:var(--dim);font-size:13px;padding:6px 0 10px}
.note{font-size:12.5px;color:var(--dim);line-height:1.75;padding:8px 0 0}
.sep{height:1px;background:var(--rule);margin:22px 0 0}
.tabular{font-variant-numeric:tabular-nums}

.row{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  padding:11px 0;border-bottom:1px solid var(--rule);min-height:52px}
.row .d{flex:none;width:58px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim);
  letter-spacing:.02em;padding-top:1px}
.row .d b{font-weight:600;color:var(--ink);font-size:14px}
.row .body{flex:1;min-width:0}
.row .t{font-size:14.5px;line-height:1.5;word-break:break-word}
.row .m{font-size:11.5px;color:var(--dim);margin-top:2px;letter-spacing:.02em;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .go{flex:none;color:var(--dim);font-size:12px;padding-top:3px}
.row.today{background:linear-gradient(90deg,var(--ai-bg),transparent 70%);
  margin:0 -8px;padding-left:8px;padding-right:8px}

.r18{flex:none;font-size:10px;letter-spacing:.06em;color:var(--shu);border:1px solid var(--shu);
  padding:0 4px;border-radius:2px;line-height:1.6}
.pill{font-size:11px;letter-spacing:.06em;padding:1px 7px;border-radius:2px;border:1px solid var(--hair);
  color:var(--dim);white-space:nowrap}
.pill.ai{color:var(--ai);border-color:var(--ai)}
.pill.md{color:var(--midori);border-color:var(--midori)}
.pill.shu{color:var(--shu);border-color:var(--shu)}
.book{margin-top:8px;font-size:11.5px;letter-spacing:.06em;color:var(--ai);
  border-top:1px dashed var(--ai);padding-top:6px}

.work{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--rule)}
.work .wt{font-family:var(--mincho);font-size:17.5px;font-weight:600;line-height:1.45}
.work .wm{font-size:12px;color:var(--dim);margin-top:3px;letter-spacing:.02em}
.work .wf{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:7px;
  font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

/* 段階の目盛り */
.steps{display:flex;align-items:center;gap:4px;margin-top:8px}
.steps i{display:block;height:3px;flex:1;background:var(--sink);border-radius:2px}
.steps i.on{background:var(--ai)}
.steps i.done{background:var(--midori)}
.steps.hold i{background:var(--sink)}
.stage-name{font-size:11.5px;letter-spacing:.06em;color:var(--ai)}
.stage-name.done{color:var(--midori)}
.stage-name.hold{color:var(--dim)}
.stepper{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 2px}
.stepper button{font-size:12px;padding:6px 10px;border:1px solid var(--hair);border-radius:2px;color:var(--dim)}
.stepper button.on{background:var(--ai);border-color:var(--ai);color:var(--paper)}
.stepper button.done{border-color:var(--midori);color:var(--midori)}
.bar{height:4px;background:var(--sink);border-radius:2px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--ai)}

/* 発行 */
.rel{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--rule)}
.rel .rt{font-family:var(--mincho);font-size:16.5px;font-weight:600}
.rel .rd{font-size:12.5px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
.rel .cd{display:inline-block;font-variant-numeric:tabular-nums;font-size:12.5px;
  border:1px solid var(--hair);border-radius:2px;padding:1px 7px;color:var(--dim);margin-top:7px}
.rel .cd.near{color:var(--shu);border-color:var(--shu)}
.rel .cd.ok{color:var(--midori);border-color:var(--midori)}

.chips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 12px}
.chip{font-size:12.5px;padding:5px 11px;border:1px solid var(--hair);border-radius:2px;color:var(--dim)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.field{display:block;padding:9px 0}
.field>span{display:block;font-size:11.5px;letter-spacing:.08em;color:var(--dim);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--paper2);border:1px solid var(--rule);
  border-radius:2px;padding:9px 10px;font-size:15px;line-height:1.6;color:var(--ink)}
.field textarea{min-height:110px;resize:vertical;font-size:14px}
.field.half{flex:1;min-width:0}
.pair{display:flex;gap:10px}
.hint{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:4px}
.hint.shu{color:var(--shu)}

.btn{display:block;width:100%;text-align:center;padding:13px 14px;border:1px solid var(--ink);
  border-radius:2px;font-size:14.5px;letter-spacing:.06em;margin-top:12px}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.quiet{border-color:var(--hair);color:var(--dim)}
.btn.danger{border-color:var(--shu);color:var(--shu)}
.btns{display:flex;gap:10px}
.link{color:var(--ai);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.back{display:inline-block;padding:12px 0 6px;color:var(--dim);font-size:13px}

.check{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;width:56px;min-height:50px;border-left:1px solid var(--rule);color:var(--dim);
  font-size:10px;letter-spacing:.04em}
.check .box{width:22px;height:22px;border:1.5px solid var(--hair);border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.check.on{color:var(--midori)}
.check.on .box{border-color:var(--midori);background:var(--midori);color:var(--paper)}

.ep{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.ep .ix{flex:none;width:22px;font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px}
.ep .ti{flex:1;min-width:0;background:var(--paper2);border:1px solid var(--rule);border-radius:2px;
  padding:7px 8px;font-size:14px}
.ep .ch{flex:none;width:72px;background:var(--paper2);border:1px solid var(--rule);border-radius:2px;
  padding:7px 6px;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.ep .tg{flex:none;width:34px;height:32px;border:1px solid var(--hair);border-radius:2px;
  font-size:10px;color:var(--dim);letter-spacing:.02em}
.ep .tg.on{border-color:var(--shu);color:var(--shu)}
.tg[disabled]{opacity:.3}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12.5px;padding:4px 9px;border:1px solid var(--hair);border-radius:2px;color:var(--ink);
  background:var(--paper2)}
.tag b{font-weight:400;color:var(--dim);margin-left:5px}
.tag.add{background:none;color:var(--dim);border-style:dashed}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper2);border-top:1px solid var(--rule);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:9}
.tabs button{flex:1;padding:11px 2px 12px;font-size:12.5px;letter-spacing:.08em;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:5px}
.tabs button .dot{width:4px;height:4px;border-radius:50%;background:transparent}
.tabs button.on{color:var(--ink)}
.tabs button.on .dot{background:var(--ai)}
@media (prefers-reduced-motion:no-preference){.row,.work,.rel{transition:background .12s ease}}
</style>
</head>
<body>

<div class="wrap">
  <header class="brand">
    <h1>帳場</h1>
    <div style="display:flex;align-items:baseline;gap:12px">
      <span class="st" id="st">読み込んでいます</span>
      <button class="st" data-act="data" style="text-decoration:underline;text-underline-offset:3px">控え</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="app"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="dash"><span class="dot"></span>いま</button>
  <button data-tab="works"><span class="dot"></span>作品</button>
  <button data-tab="books"><span class="dot"></span>本</button>
  <button data-tab="sched"><span class="dot"></span>公開</button>
</nav>

<script>
(function(){
"use strict";

/* ============ 語彙 ============ */
var STAGES=["未記入","構想","矛盾検証","起稿","統合","文体改稿","入稿テキスト","完成","保留"];
var STEP={"未記入":-2,"保留":-1,"構想":0,"矛盾検証":1,"起稿":2,"統合":3,"文体改稿":4,"入稿テキスト":5,"完成":6};
var KINDS=[["未定","未定"],["web","pixiv"],["本","同人誌"],["両方","本＋pixiv"]];
var WD=["日","月","火","水","木","金","土"];
var KEY="novel-queue:data";

var S={works:[],episodes:[],series:[],releases:[],settings:{time:"19:00",warnDays:3,deadlineDays:21},v:2};
var view={name:"dash"};
var stack=[];
var filt={works:"すべて"};
var ready=false;

var ESC={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return ESC[c]})}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3)}
function pad(n){return (n<10?"0":"")+n}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function dpart(s){return s?String(s).slice(0,10):null}
function tpart(s){return s&&String(s).length>=16?String(s).slice(11,16):(S.settings.time||"19:00")}
function joinDT(d,t){return d?d+"T"+(t||S.settings.time||"19:00"):null}
function dobj(ds){var p=String(ds).split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function shift(ds,n){var d=dobj(ds);d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function md(ds){var d=dobj(ds);return (d.getMonth()+1)+"/"+d.getDate()}
function wdOf(ds){return WD[dobj(ds).getDay()]}
function longDate(ds){var d=dobj(ds);return (d.getMonth()+1)+"月"+d.getDate()+"日"}
function diffDays(a,b){return Math.round((dobj(b)-dobj(a))/86400000)}
function num(n){return Number(n||0).toLocaleString("ja-JP")}

function work(id){for(var i=0;i<S.works.length;i++)if(S.works[i].id===id)return S.works[i];return null}
function ep(id){for(var i=0;i<S.episodes.length;i++)if(S.episodes[i].id===id)return S.episodes[i];return null}
function series(id){for(var i=0;i<S.series.length;i++)if(S.series[i].id===id)return S.series[i];return null}
function release(id){for(var i=0;i<S.releases.length;i++)if(S.releases[i].id===id)return S.releases[i];return null}
function epsOf(id){return S.episodes.filter(function(e){return e.workId===id})
  .sort(function(a,b){return (a.index||0)-(b.index||0)})}
function worksOf(k,id){return S.works.filter(function(w){return w[k]===id})
  .sort(function(a,b){return (a.order||0)-(b.order||0)})}
function scheduled(){return S.episodes.filter(function(e){return e.scheduledAt})
  .sort(function(a,b){return String(a.scheduledAt)<String(b.scheduledAt)?-1:1})}
function isWriting(w){var n=STEP[w.stage];return n>=2&&n<=5}
function isPlanning(w){var n=STEP[w.stage];return n===0||n===1}
function kindLabel(k){for(var i=0;i<KINDS.length;i++)if(KINDS[i][0]===k)return KINDS[i][1];return "未定"}
function touch(w){w.updatedAt=today()}

/* ============ 数え ============ */
function stats(){
  var t=today(),seen={},days=[];
  S.episodes.forEach(function(e){
    if(e.reserved&&e.scheduledAt&&dpart(e.scheduledAt)>=t){
      var d=dpart(e.scheduledAt);if(!seen[d]){seen[d]=1;days.push(d)}}
  });
  days.sort();
  return {days:days.length,last:days.length?days[days.length-1]:null,
    waiting:S.episodes.filter(function(e){return e.checked&&!e.reserved}).length,
    writing:S.works.filter(isWriting).length,
    blank:S.works.filter(function(w){return w.stage==="未記入"}).length,
    done:S.works.filter(function(w){return w.stage==="完成"}).length};
}
function futureReleases(){
  var t=today();
  return S.releases.filter(function(r){return !r.eventDate||r.eventDate>=t})
    .sort(function(a,b){
      var x=a.deadlineAt||a.eventDate||"9999",y=b.deadlineAt||b.eventDate||"9999";
      return x<y?-1:x>y?1:0});
}
function nextDeadline(){
  var t=today(),best=null;
  S.releases.forEach(function(r){
    if(!r.deadlineAt||r.deadlineAt<t||r.state==="入稿済"||r.state==="頒布済")return;
    if(!best||r.deadlineAt<best.deadlineAt)best=r;
  });
  return best;
}
function nextEvent(){
  var t=today(),best=null;
  S.releases.forEach(function(r){
    if(!r.eventDate||r.eventDate<t)return;
    if(!best||r.eventDate<best.eventDate)best=r;
  });
  return best;
}

/* ============ 保存 ============ */
var store={kind:"none"},saveTimer=null,statusTimer=null;
function setStatus(t){var n=document.getElementById("st");if(n)n.textContent=t}
function banner(msg,withHelp,tone){
  var n=document.getElementById("banner");if(!n)return;
  n.innerHTML='<div class="banner'+(tone==="ok"?" ok":"")+'">'+esc(msg)+
    (withHelp?'<button data-act="data">控えを開く</button>':'')+'</div>';
}
function clearBanner(){var n=document.getElementById("banner");if(n)n.innerHTML=""}

function openStore(){
  return Promise.resolve().then(function(){
    var w=window.storage;
    if(w&&(typeof w.get==="function"||typeof w.getItem==="function")){
      store={kind:"host",label:"この環境の保存領域",
        read:function(){return Promise.resolve(w.get?w.get(KEY):w.getItem(KEY))},
        write:function(v){return Promise.resolve(w.set?w.set(KEY,v):w.setItem(KEY,v))}};
      return;
    }
    if(window.claude&&typeof window.claude.use==="function"){
      return window.claude.use("db").then(function(db){
        if(!db)return;
        var ref=db.doc("novel-queue/data");
        store={kind:"db",label:"この道具の保存領域",
          read:function(){return ref.get().then(function(s){return s.exists?(s.data()||{}).json:null})},
          write:function(v){return ref.set({json:v,savedAt:new Date().toISOString()})}};
      });
    }
  }).catch(function(e){
    store={kind:"none"};
    banner("保存先につながりませんでした（"+(e&&e.message||e)+"）。この画面での変更は残りません。",true);
  });
}
function load(){
  return openStore().then(function(){
    if(!store.read){
      ready=true;render();
      banner("保存先が見つかりません。この画面での変更は残りません。控えから書き出して持ち出してください。",true);
      setStatus("保存できません");return;
    }
    return store.read().then(function(raw){
      if(raw){
        try{adopt(JSON.parse(raw))}
        catch(e){banner("保存されていた内容を読めませんでした（"+(e&&e.message||e)+"）。",true)}
      }
      ready=true;render();setStatus("保存ずみ");
    });
  }).catch(function(e){
    ready=true;render();
    banner("読み込みに失敗しました（"+(e&&e.message||e)+"）。",true);
    setStatus("読み込めません");
  });
}
function adopt(d){
  if(!d||typeof d!=="object")return;
  S.works=Array.isArray(d.works)?d.works:[];
  S.episodes=Array.isArray(d.episodes)?d.episodes:[];
  S.series=Array.isArray(d.series)?d.series:[];
  S.releases=Array.isArray(d.releases)?d.releases:[];
  S.settings=Object.assign({time:"19:00",warnDays:3,deadlineDays:21},d.settings||{});
  S.v=2;
  /* 旧いかたちからの繰り越し */
  S.works.forEach(function(w){
    if(!w.stage)w.stage=w.status==="投稿済"||w.status==="検査済"?"完成":w.status==="保留"?"保留":"文体改稿";
    if(!w.kind)w.kind=w.isBook?"本":"web";
    if(w.charsNow==null)w.charsNow=w.totalChars||0;
    if(w.driveUrl==null)w.driveUrl="";
    if(w.driveTitle==null)w.driveTitle="";
    if(w.driveModified==null)w.driveModified="";
    if(w.driveQuery==null)w.driveQuery="";
    if(w.driveState==null)w.driveState="";
    if(w.driveCheckedAt==null)w.driveCheckedAt="";
    if(w.driveHits==null)w.driveHits=0;
  });
}
function save(){
  setStatus("保存中");
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,700);
}
function flush(){
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null}
  if(!store.write){setStatus("保存できません");return Promise.resolve()}
  var payload;
  try{payload=JSON.stringify(S)}
  catch(e){banner("保存するかたちに直せませんでした（"+(e&&e.message||e)+"）。",true);return Promise.resolve()}
  return Promise.resolve(store.write(payload)).then(function(){
    setStatus("保存しました");
    if(statusTimer)clearTimeout(statusTimer);
    statusTimer=setTimeout(function(){setStatus("保存ずみ")},2200);
  }).catch(function(e){
    setStatus("保存できませんでした");
    banner("保存できませんでした（"+(e&&e.message||e)+"）。控えから書き出して残しておいてください。",true);
  });
}
window.addEventListener("pagehide",function(){if(saveTimer)flush()});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"&&saveTimer)flush()});


/* ============ ドライブ ============ */
var mcpNs=null,mcpAsked=false,driveConn={state:"未確認",msg:""};
function getMcp(){
  if(mcpNs)return Promise.resolve(mcpNs);
  if(!(window.claude&&typeof window.claude.use==="function"))return Promise.resolve(null);
  return window.claude.use("mcp").then(function(m){mcpNs=m;return m});
}
function mcpFix(code){
  switch(code){
    case "needs_reauth":return "Googleドライブの接続が切れています。claude.ai の 設定 → コネクタ でつなぎ直してください。";
    case "server_not_connected":return "Googleドライブがつながっていません。claude.ai の 設定 → コネクタ で追加してください。";
    case "selection_required":return "同じ名前のコネクタが複数あります。どれを使うか選ぶと見に行けます。";
    case "blocked_by_policy":return "この環境ではドライブの呼び出しが止められています。";
    case "approval_required":return "この呼び出しには承認が要ります。いまは通せません。";
    case "not_in_manifest":return "この画面はドライブの検索しか呼べません。";
    case "server_unavailable":return "ドライブがいま応えません。少し置いて、もう一度押してください。";
    case "rate_limited":return "呼び出しが立て込んでいます。少し置いてください。";
    case "tool_error":return "ドライブが検索を断りました。";
    case "cancelled":return "取り消しました。";
    case "not_granted":case "capability_disabled":case "capability_removed":
      return "この画面からはドライブを見に行けません。";
    default:return "ドライブを見に行けませんでした。";
  }
}
function checkDrive(){
  return getMcp().then(function(m){
    if(!m){driveConn={state:"使えません",msg:mcpFix("capability_disabled")};return}
    return m.listTools().then(function(r){
      var found=null;
      ((r&&r.servers)||[]).forEach(function(sv){if(sv.server==="Google Drive")found=sv});
      if(!found){driveConn={state:"つながっていません",msg:mcpFix("server_not_connected")}}
      else if(found.authStatus==="needs_reauth"){driveConn={state:"つなぎ直しが要ります",msg:mcpFix("needs_reauth")}}
      else{driveConn={state:"つながっています",msg:""}}
    });
  }).catch(function(e){
    driveConn={state:"確かめられません",msg:mcpFix(e&&e.code)};
  });
}
function qEsc(x){return String(x||"").replace(/\\/g,"").replace(/'/g,"\\'")}
function searchWord(w){
  if(w.driveQuery)return w.driveQuery;
  var t=String(w.title||"");
  t=t.replace(/[『』]/g,"").split("（")[0].split("(")[0].split("／")[0].trim();
  return t;
}
function driveSearch(word,retried){
  return getMcp().then(function(m){
    if(!m)return Promise.reject({code:"capability_disabled"});
    return m.callTool("Google Drive","search_files",
      {query:"title contains '"+qEsc(word)+"'",pageSize:8,excludeContentSnippets:true},
      {cache:{staleTime:60000}});
  }).then(function(res){
    var p=res&&res.payload;
    if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){p=null}}
    var files=((p&&p.files)||[]).filter(function(f){
      return f.mimeType!=="application/vnd.google-apps.folder"});
    files.sort(function(a,b){return (b.modifiedTime||"")<(a.modifiedTime||"")?-1:1});
    return files;
  }).catch(function(e){
    if(!retried&&e&&e.retryable){
      return new Promise(function(r){setTimeout(r,900+Math.random()*600)})
        .then(function(){return driveSearch(word,true)});
    }
    return Promise.reject(e);
  });
}
function bindDrive(w,f){
  w.driveTitle=f.title;w.driveUrl=f.viewUrl;
  w.driveModified=String(f.modifiedTime||"").slice(0,10);
  w.driveCheckedAt=today();w.driveState="";w.driveHits=0;
}
/* 控えの見立て——手で印をつけていればそれを優先する */
function backupState(w){
  if(!w.driveUrl)return {k:"none",t:(w.driveHits?"候補あり":"控えなし")};
  if(w.driveState==="最新")return {k:"ok",t:"控えは最新"};
  if(w.driveState==="古い")return {k:"old",t:"控えが古い"};
  if(w.updatedAt&&w.driveModified&&w.updatedAt>w.driveModified)
    return {k:"old",t:"控えが古いかも"};
  return {k:"ok",t:"控えあり"+(w.driveModified?"（"+w.driveModified.slice(5).replace("-","/")+"）":"")};
}
function needsBackup(){
  return S.works.filter(function(w){
    if(w.stage==="保留")return false;
    return backupState(w).k!=="ok";
  }).sort(function(a,b){return STEP[b.stage]-STEP[a.stage]});
}
/* 順に見に行く（一度に見るのは12本まで） */
function sweep(list,line){
  var i=0,upd=0,cand=0,none=0,err=null;
  function step(){
    if(i>=list.length||err){
      var msg=list.length+"本のうち"+i+"本を見に行きました。更新あり"+upd+"／候補あり"+cand+"／見つからず"+none;
      if(err)msg+="。"+mcpFix(err.code);
      save();render();banner(msg,false,err?false:"ok");return;
    }
    var w=list[i];
    if(line)line.textContent="見に行っています… "+(i+1)+"/"+list.length+"　"+w.title;
    var word=w.driveUrl&&w.driveTitle?w.driveTitle:searchWord(w);
    driveSearch(word).then(function(files){
      w.driveCheckedAt=today();
      if(w.driveUrl){
        var same=null;
        files.forEach(function(f){if(f.viewUrl===w.driveUrl||f.title===w.driveTitle)same=f});
        if(same){
          var m=String(same.modifiedTime||"").slice(0,10);
          if(m&&m!==w.driveModified){w.driveModified=m;w.driveState="";upd++}
        }else{none++}
      }else{
        w.driveHits=files.length;
        if(files.length)cand++;else none++;
      }
      i++;setTimeout(step,220);
    }).catch(function(e){err=e;step()});
  }
  step();
}

function move(t,m,attr){

    '<span class="m">'+m+'</span></span><span class="go">›</span></button>';

function nextMoves(){
  var h='<section><h2>次の手</h2>',n=0,t=today();

  if(dl){
    var nr=worksOf("releaseId",dl.id).filter(function(w){return w.stage!=="完成"})

      'data-act="work" data-id="'+blanks[0].id+'"');n++;
  }
  var stale=S.works.filter(function(w){return isWriting(w)&&STEP[w.stage]>=2&&w.updatedAt})

  if(n<3&&stale.length&&diffDays(stale[0].updatedAt,t)>=7){
    h+=move(esc(stale[0].title),diffDays(stale[0].updatedAt,t)+"日ぶん動いていません（"+stale[0].stage+"）",

      'data-act="split" data-id="'+(w?w.id:"")+'"');n++;

  var idea=S.works.filter(function(w){return (w.stage==="構想"||w.stage==="未記入")&&w.releaseId});

    h+=move(esc(idea[0].title),"便に載っているのにまだ構想のまま",'data-act="work" data-id="'+idea[0].id+'"');n++;
  }

/* ---- 本 ---- */
function vBooks(){
  var h="",t=today();

  h+='<button class="btn" data-act="new-release">発行を足す</button>';
  h+='</section>';

  var doneRs=S.releases.filter(function(r){return r.eventDate&&r.eventDate<t});
  if(doneRs.length){
    h+='<div class="sep"></div><section><h2>すんだ発行<span class="n">'+doneRs.length+'</span></h2>';
    doneRs.sort(function(a,b){return a.eventDate<b.eventDate?1:-1}).slice(0,6).forEach(function(r){
      h+='<button class="row" data-act="release" data-id="'+r.id+'" style="opacity:.65">'+
        '<span class="body"><span class="t">'+esc(r.title)+'</span><span class="m">'+
        longDate(r.eventDate)+'</span></span><span class="go">›</span></button>';

    var ws=worksOf("seriesId",s.id);
    var done=ws.filter(function(w){return w.stage==="完成"}).length;
    h+='<button class="row" data-act="series" data-id="'+s.id+'">'+
      '<span class="body"><span class="t">'+esc(s.title)+'</span><span class="m">'+

  h+='</section>';
  h+='<div class="sep"></div><div class="note">便の区切りと収録は fanfic-production の刊行計画（2026.9.6 合意）から起こしてあります。入稿日はまだ入っていません。決まったら入れてください。</div>';
  return h;
}
function relRow(r,t){
  var ws=worksOf("releaseId",r.id),done=ws.filter(function(w){return w.stage==="完成"}).length;
  var cd="",cls="";
  if(r.deadlineAt&&r.deadlineAt>=t){
    var n=diffDays(t,r.deadlineAt);
    cd="入稿まで "+n+"日";cls=n<=7?" near":"";
  }else if(r.deadlineAt){cd="入稿日すぎ";cls=" near"}
  else{cd="入稿日 未定"}
  if(r.state==="入稿済"){cd="入稿ずみ";cls=" ok"}
  return '<button class="rel" data-act="release" data-id="'+r.id+'">'+
    '<div class="rt">'+esc(r.title)+'</div>'+
    '<div class="rd">'+(r.eventDate?longDate(r.eventDate)+" "+wdOf(r.eventDate)+"曜":esc(r.dateNote||"時期未定"))+
    '　／　'+ws.length+'冊（完成'+done+'）</div>'+
    '<span class="cd'+cls+'">'+cd+'</span>'+
    '</button>';
}

/* ---- 公開 ---- */
function vSched(){
  var t=today(),h="",list=scheduled();
  var past=list.filter(function(e){return dpart(e.scheduledAt)<t});
  var future=list.filter(function(e){return dpart(e.scheduledAt)>=t});
  var undated=S.episodes.filter(function(e){return !e.scheduledAt});
  var s=stats();
  h+='<div class="note" style="padding:4px 0 12px">予約ずみ '+s.days+'日ぶん　／　仕込み待ち '+s.waiting+'本</div>';
  h+='<section><h2>これから<span class="n">'+future.length+'本</span></h2>';
  if(!future.length)h+='<div class="empty">日付の入った話がありません。</div>';
  future.forEach(function(e,i){h+=schedRow(e,i,future)});
  h+='</section>';
  if(undated.length){
    h+='<div class="sep"></div><section><h2>日付なし<span class="n">'+undated.length+'本</span></h2>';
    undated.forEach(function(e){
      h+='<button class="row" data-act="ep" data-id="'+e.id+'">'+
        '<span class="d" style="color:var(--dim)">未定</span>'+
        '<span class="body"><span class="t">'+esc(e.title)+'</span><span class="m">'+
        (e.isR18?'<span class="r18">R-18</span>':"")+'<span class="tabular">'+num(e.chars)+'字</span>'+
        (e.checked?'<span class="pill ai">検査済</span>':'<span class="pill">未検査</span>')+
        '</span></span><span class="go">›</span></button>';
    });
    h+='</section>';
  }
  if(past.length){
    h+='<div class="sep"></div><section><h2>すぎた日<span class="n">'+past.length+'本</span></h2>';
    past.slice(-8).forEach(function(e){
      var d=dpart(e.scheduledAt);
      h+='<button class="row" data-act="ep" data-id="'+e.id+'" style="opacity:.62">'+
        '<span class="d"><b>'+md(d)+'</b> '+wdOf(d)+'</span>'+
        '<span class="body"><span class="t">'+esc(e.title)+'</span><span class="m">'+
        (e.reserved?'<span class="pill md">予約ずみ</span>':'<span class="pill">未予約</span>')+
        '</span></span><span class="go">›</span></button>';
    });
    h+='</section>';
  }
  h+='<div class="sep"></div><div class="note">チェックは「pixivの予約に入れ終えた」印です。文体検査の済みとは別に持っています。</div>';
  return h;
}
function schedRow(e,i,arr){

  h+='<button class="d" style="text-align:left;padding-top:2px" data-act="ep" data-id="'+e.id+'">'+
     '<b>'+md(d)+'</b> '+wdOf(d)+'<br><span style="font-size:11px">'+tpart(e.scheduledAt)+'</span></button>';
  h+='<button class="body" style="text-align:left" data-act="ep" data-id="'+e.id+'">'+
     '<span class="t">'+esc(e.title)+'</span><span class="m">'+
     (e.isR18?'<span class="r18">R-18</span>':"")+'<span class="tabular">'+num(e.chars)+'字</span>'+
     (e.checked?"":'<span class="pill">未検査</span>')+
     (tpart(e.scheduledAt)>="20:00"?'<span class="pill shu">20時すぎ</span>':"")+'</span></button>';

  h+='<button class="check'+(e.reserved?" on":"")+'" data-act="tg-res" data-id="'+e.id+'">'+
     '<span class="box">✓</span>予約</button></div>';
  return h;
}

  h+='<button class="link" data-act="copy-cap" data-id="'+e.id+'">前の話からキャプションを写す</button>';
  h+='<section><h2>タグ<span class="n">'+(e.tags||[]).length+'</span></h2><div class="tags">';
  (e.tags||[]).forEach(function(tg,i){
    h+='<button class="tag" data-act="del-tag" data-id="'+e.id+'" data-i="'+i+'">'+esc(tg)+'<b>×</b></button>';
  });
  h+='</div>';
  h+='<label class="field"><span>足す（読点・改行で区切っても入ります）</span><input id="tagInput" placeholder="原神, ファルカ×ローエン"></label>';
  h+='<div class="btns"><button class="btn" data-act="add-tag" data-id="'+e.id+'">タグを足す</button>'+
     '<button class="btn quiet" data-act="copy-tags" data-id="'+e.id+'">前の話から写す</button></div>';
  var bank=tagBank().filter(function(x){return (e.tags||[]).indexOf(x.t)<0}).slice(0,12);
  if(bank.length){
    h+='<div class="hint" style="margin-top:14px">よく使うタグ（押すと足します）</div><div class="tags">';
    bank.forEach(function(x){
      h+='<button class="tag add" data-act="bank-tag" data-id="'+e.id+'" data-t="'+esc(x.t)+'">'+esc(x.t)+'<b>'+x.n+'</b></button>';
    });
    h+='</div><div class="hint">表記ゆれは流入に響きます。過去作と同じ表記から選んでください。</div>';
  }
  h+='</section>';
  h+='<button class="btn danger" data-act="del-ep" data-id="'+e.id+'">この話を消す</button>';
  return h;
}
function tagBank(){
  var m={};
  S.episodes.forEach(function(e){(e.tags||[]).forEach(function(t){m[t]=(m[t]||0)+1})});
  return Object.keys(m).map(function(t){return {t:t,n:m[t]}})
    .sort(function(a,b){return b.n-a.n||(a.t<b.t?-1:1)});
}
function prevEp(e){
  var es=epsOf(e.workId).filter(function(x){return x.index<e.index});
  return es.length?es[es.length-1]:null;
}

/* ---- 控え ---- */
function vData(){
  var h='<button class="back" data-act="back">‹ もどる</button>';
  var nb=needsBackup(),ok=S.works.length-nb.length;
  h+='<section><h2>ドライブの点検</h2>';
  h+='<div class="note" style="padding:0 0 8px">コネクタ：'+esc(driveConn.state)+
     (driveConn.msg?'<br><span style="color:var(--shu)">'+esc(driveConn.msg)+'</span>':"")+'</div>';
  h+='<dl class="facts" style="border-top:1px solid var(--rule)">'+
     '<div><dt>控えが要るもの</dt><dd>'+nb.length+'<span>本</span></dd></div>'+
     '<div><dt>控えあり</dt><dd>'+ok+'<span>本</span></dd></div></dl>';
  h+='<div class="hint" id="sweepLine">押すと、上から12本ずつドライブを見に行きます。'+
     'すでに結んである原稿は更新日を取り直し、まだ結んでいないものは候補があるかだけ見ます（勝手には結びません）。</div>';
  h+='<button class="btn fill" data-act="dr-sweep">ドライブを見に行く（12本ずつ）</button>';
  if(nb.length){
    h+='<section><h2>控えが要るもの<span class="n">'+nb.length+'本</span></h2>';
    nb.slice(0,20).forEach(function(w){
      var b=backupState(w);
      h+='<button class="row" data-act="work" data-id="'+w.id+'">'+
        '<span class="body"><span class="t">'+esc(w.title)+'</span><span class="m">'+
        stageName(w)+'<span class="pill'+(b.k==="old"?" shu":"")+'">'+b.t+'</span>'+
        (w.driveModified?'<span class="tabular">ドライブ '+esc(w.driveModified)+'</span>':"")+
        (w.updatedAt?'<span class="tabular">台帳 '+esc(w.updatedAt)+'</span>':"")+
        '</span></span><span class="go">›</span></button>';
    });
    h+='</section>';
  }
  h+='</section><div class="sep"></div>';
  h+='<section><h2>控え</h2>';
  h+='<div class="note">保存先：'+(store.label||"なし（この画面での変更は残りません）")+'<br>'+
     '作品 '+S.works.length+'本 ／ 話 '+S.episodes.length+'本 ／ シリーズ '+S.series.length+' ／ 発行 '+S.releases.length+'</div>';
  h+='<button class="btn fill" data-act="export">JSONで書き出す</button>';
  h+='<div class="hint">端末に保存できないときは、下の枠に出た文字を丸ごと写して控えてください。</div>';
  h+='<label class="field"><span>読み書きする JSON</span><textarea id="io" placeholder="ここに控えたJSONを貼って、下のボタンを押します" style="min-height:150px;font-size:12px"></textarea></label>';
  h+='<button class="btn danger" data-act="import">貼ったJSONで置き換える</button>';
  h+='<div class="hint">いまの中身はすべて入れ替わります。先に書き出しておいてください。</div>';
  h+='<div class="sep"></div>';
  h+='<label class="field"><span>既定の投稿時刻</span><input type="time" value="'+(S.settings.time||"19:00")+'" data-s="time"></label>';
  h+='<label class="field"><span>予約の在庫を警告する日数</span><input type="number" inputmode="numeric" value="'+(S.settings.warnDays||3)+'" data-s="warnDays"></label>';
  h+='<label class="field"><span>入稿を大きく出す日数</span><input type="number" inputmode="numeric" value="'+(S.settings.deadlineDays||21)+'" data-s="deadlineDays"></label>';
  h+='<div class="hint">入稿日がこの日数より近づくと、いちばん大きい数字が「入稿まであと何日」に変わります。</div>';
  h+='</section>';
  return h;
}

/* ============ 操作 ============ */
function reindex(workId){epsOf(workId).forEach(function(e,i){e.index=i+1})}
function usedDates(exclude){
  var m={};
  S.episodes.forEach(function(e){if(e.scheduledAt&&exclude.indexOf(e.id)<0)m[dpart(e.scheduledAt)]=1});
  return m;
}
function assign(workId){
  var sd=document.getElementById("startDate"),st=document.getElementById("startTime"),
      mo=document.getElementById("assignMode");
  var start=sd&&sd.value?sd.value:today();
  var time=st&&st.value?st.value:(S.settings.time||"19:00");
  var mode=mo?mo.value:"empty";
  var es=epsOf(workId).filter(function(e){return mode==="all"?true:!e.scheduledAt});
  if(!es.length){banner("振る話がありません。");return}
  S.settings.time=time;
  var ids=es.map(function(e){return e.id}),used=usedDates(ids),d=start,n=0;
  es.forEach(function(e){
    var g=0;while(used[d]&&g<400){d=shift(d,1);g++}
    e.scheduledAt=joinDT(d,time);used[d]=1;d=shift(d,1);n++;
  });
  save();render();clearBanner();
  banner(n+"本に日付を振りました（"+longDate(dpart(es[0].scheduledAt))+"から）。",false,"ok");
}
function addEpisode(workId){
  var es=epsOf(workId),w=work(workId),n=es.length+1;
  S.episodes.push({id:uid(),workId:workId,index:n,title:(w?w.title:"")+"（"+n+"）",chars:0,
    isR18:false,checked:false,caption:"",tags:es.length?(es[es.length-1].tags||[]).slice():[],
    scheduledAt:null,reserved:false});
  save();render();
}
function parseTags(s){
  return String(s||"").split(/[,、\n\r\t 　]+/).map(function(x){return x.trim()}).filter(function(x){return x.length});
}
function swap(id,dir){
  var t=today(),arr=scheduled().filter(function(e){return dpart(e.scheduledAt)>=t});
  var i=-1;arr.forEach(function(e,k){if(e.id===id)i=k});
  var j=i+dir;
  if(i<0||j<0||j>=arr.length)return;
  var a=arr[i],b=arr[j],tmp=a.scheduledAt;
  a.scheduledAt=b.scheduledAt;b.scheduledAt=tmp;save();render();
}
function exportJSON(){
  var text=JSON.stringify(S,null,2),io=document.getElementById("io");
  if(io)io.value=text;
  var name="帳場-"+today()+".json";
  if(window.claude&&typeof window.claude.use==="function"){
    window.claude.use("downloads").then(function(d){
      if(!d){banner("端末に保存できないので、下の枠に出しました。丸ごと写して控えてください。",false,"ok");return}
      d.save({filename:name,data:text}).then(function(){clearBanner();setStatus("書き出しました")})
       .catch(function(e){
         if(e&&e.code==="declined")return;
         banner("書き出せませんでした（"+(e&&e.message||e)+"）。下の枠から写してください。");
       });
    });
  }else{banner("下の枠に出しました。丸ごと写して控えてください。",false,"ok")}
}
function importJSON(){
  var io=document.getElementById("io");
  if(!io||!io.value.trim()){banner("枠にJSONを貼ってから押してください。");return}
  var d;
  try{d=JSON.parse(io.value)}catch(e){banner("JSONとして読めませんでした（"+(e&&e.message||e)+"）。");return}
  if(!d||!Array.isArray(d.works)){banner("作品の入っていないJSONです。読み込みませんでした。");return}
  adopt(d);save();clearBanner();jump({name:"dash"});
}

/* ============ 受け ============ */
document.getElementById("tabs").addEventListener("click",function(ev){
  var b=ev.target.closest("button[data-tab]");if(!b)return;
  jump({name:b.getAttribute("data-tab")});
});
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act"),id=b.getAttribute("data-id");
  if(act==="tab"){jump({name:id});return}
  if(act==="back"){back();return}
  if(act==="data"){
    go({name:"data"});
    if(!mcpAsked){mcpAsked=true;checkDrive().then(function(){if(view.name==="data")render()})}
    return;
  }
  if(act==="dr-find"){
    var wf=work(id);if(!wf)return;
    view.driveErr="";view.hits=null;
    banner("ドライブを見に行っています…",false,"ok");
    driveSearch(searchWord(wf)).then(function(files){
      view.hits=files;view.driveErr="";clearBanner();render();
    }).catch(function(e){
      view.hits=null;view.driveErr=mcpFix(e&&e.code);clearBanner();render();
    });
    return;
  }
  if(act==="dr-bind"){
    var wb=work(id),f=(view.hits||[])[+b.getAttribute("data-i")];
    if(!wb||!f)return;
    bindDrive(wb,f);view.hits=null;save();render();return;
  }
  if(act==="dr-state"){
    var ws=work(id),st2=b.getAttribute("data-s");if(!ws)return;
    ws.driveState=ws.driveState===st2?"":st2;
    ws.driveCheckedAt=today();save();render();return;
  }
  if(act==="dr-sweep"){
    var list=S.works.filter(function(w){return w.stage!=="保留"})
      .sort(function(a,b){return (a.driveCheckedAt||"")<(b.driveCheckedAt||"")?-1:1}).slice(0,12);
    if(!list.length){banner("見に行くものがありません。");return}
    sweep(list,document.getElementById("sweepLine"));
    return;
  }
  if(act==="filter"){filt.works=id;render();return}
  if(act==="work"){go({name:"work",workId:id});return}
  if(act==="ep"){go({name:"ep",epId:id});return}
  if(act==="split"){go({name:"split",workId:id||null});return}
  if(act==="release"){go({name:"release",releaseId:id});return}
  if(act==="series"){go({name:"series",seriesId:id});return}
  if(act==="pick"){go({name:"pick",pickKind:b.getAttribute("data-k"),pickId:id});return}
  if(act==="toggle-pick"){
    var w0=work(id);if(!w0)return;
    var key=view.pickKind==="series"?"seriesId":"releaseId";
    w0[key]=w0[key]===view.pickId?"":view.pickId;
    touch(w0);save();render();return;
  }
  if(act==="stage"){
    var w1=work(id);if(!w1)return;
    w1.stage=b.getAttribute("data-s");touch(w1);save();render();return;
  }
  if(act==="touch"){var w2=work(id);if(w2){touch(w2);save();render()}return}
  if(act==="new-work"){
    var w3={id:uid(),title:"新しい作品",fandom:"",kind:"未定",stage:"構想",chaptersDone:0,
      chaptersTotal:0,charsNow:0,charsTarget:0,seriesId:"",releaseId:"",note:"",updatedAt:today(),
      driveUrl:"",driveTitle:"",driveModified:"",driveQuery:"",driveState:"",driveCheckedAt:"",driveHits:0};
    S.works.unshift(w3);save();go({name:"work",workId:w3.id});return;
  }
  if(act==="del-work"){
    var w4=work(id);if(!w4)return;
    if(!window.confirm("「"+w4.title+"」と、その話をすべて消します。よろしいですか。"))return;
    S.works=S.works.filter(function(x){return x.id!==id});
    S.episodes=S.episodes.filter(function(x){return x.workId!==id});
    save();jump({name:"works"});return;
  }
  if(act==="new-release"){
    var r={id:uid(),title:"新しい発行",eventDate:"",deadlineAt:"",dateNote:"",state:"予定",note:""};
    S.releases.push(r);save();go({name:"release",releaseId:r.id});return;
  }
  if(act==="del-release"){
    var r2=release(id);if(!r2)return;
    if(!window.confirm("「"+r2.title+"」を消します。作品は残ります。"))return;
    S.releases=S.releases.filter(function(x){return x.id!==id});
    S.works.forEach(function(w){if(w.releaseId===id)w.releaseId=""});
    save();jump({name:"books"});return;
  }
  if(act==="new-series"){
    var y={id:uid(),title:"新しいシリーズ",fandom:"",note:""};
    S.series.push(y);save();go({name:"series",seriesId:y.id});return;
  }
  if(act==="del-series"){
    var y2=series(id);if(!y2)return;
    if(!window.confirm("「"+y2.title+"」を消します。作品は残ります。"))return;
    S.series=S.series.filter(function(x){return x.id!==id});
    S.works.forEach(function(w){if(w.seriesId===id)w.seriesId=""});
    save();jump({name:"books"});return;
  }
  if(act==="add-ep"){addEpisode(id);return}
  if(act==="renumber"){
    var w5=work(id);if(!w5)return;
    var es=epsOf(id);
    es.forEach(function(e,i){
      e.index=i+1;
      e.title=w5.title+(es.length===1?"":"（"+(i+1)+(i===es.length-1?"・完":"")+"）");
    });
    save();render();return;
  }
  if(act==="assign"){assign(id);return}
  if(act==="tg-r18"){var e1=ep(id);if(e1){e1.isR18=!e1.isR18;save();render()}return}
  if(act==="tg-check"){var e2=ep(id);if(e2){e2.checked=!e2.checked;save();render()}return}
  if(act==="tg-res"){var e3=ep(id);if(e3){e3.reserved=!e3.reserved;save();render()}return}
  if(act==="up"){swap(id,-1);return}
  if(act==="down"){swap(id,1);return}
  if(act==="del-ep"){
    var e4=ep(id);if(!e4)return;
    if(!window.confirm("「"+e4.title+"」を消します。よろしいですか。"))return;
    var wid=e4.workId;
    S.episodes=S.episodes.filter(function(x){return x.id!==id});
    reindex(wid);save();jump({name:"work",workId:wid});return;
  }
  if(act==="add-tag"){
    var e5=ep(id),inp=document.getElementById("tagInput");if(!e5||!inp)return;
    var add=parseTags(inp.value);if(!add.length)return;
    e5.tags=(e5.tags||[]);
    add.forEach(function(t){if(e5.tags.indexOf(t)<0)e5.tags.push(t)});
    inp.value="";save();render();return;
  }
  if(act==="bank-tag"){
    var e6=ep(id),t6=b.getAttribute("data-t");if(!e6)return;
    e6.tags=(e6.tags||[]);if(e6.tags.indexOf(t6)<0)e6.tags.push(t6);
    save();render();return;
  }
  if(act==="del-tag"){
    var e7=ep(id),i7=+b.getAttribute("data-i");if(!e7)return;
    e7.tags=(e7.tags||[]);e7.tags.splice(i7,1);save();render();return;
  }
  if(act==="copy-tags"){
    var e8=ep(id);if(!e8)return;var p8=prevEp(e8);
    if(!p8||!(p8.tags||[]).length){banner("写せる前の話がありません。");return}
    e8.tags=(p8.tags||[]).slice();save();render();clearBanner();return;
  }
  if(act==="copy-cap"){
    var e9=ep(id);if(!e9)return;var p9=prevEp(e9);
    if(!p9||!p9.caption){banner("写せる前の話のキャプションがありません。");return}
    e9.caption=p9.caption;save();render();clearBanner();return;
  }
  if(act==="export"){exportJSON();return}
  if(act==="import"){importJSON();return}
});
document.getElementById("app").addEventListener("change",function(ev){
  var t=ev.target,v=t.value,f=t.getAttribute("data-f");
  var wid=t.getAttribute("data-w"),eid=t.getAttribute("data-e"),rid=t.getAttribute("data-r"),
      yid=t.getAttribute("data-y"),sk=t.getAttribute("data-s");
  if(sk){
    if(sk==="warnDays")S.settings.warnDays=Math.max(1,+v||3);
    else if(sk==="deadlineDays")S.settings.deadlineDays=Math.max(1,+v||21);
    else S.settings[sk]=v;
    save();render();return;
  }
  if(wid){
    var w=work(wid);if(!w)return;
    if(f==="chaptersDone"||f==="chaptersTotal"||f==="charsNow"||f==="charsTarget")w[f]=+v||0;
    else w[f]=v;
    touch(w);save();
    if(f!=="note"&&f!=="fandom"&&f!=="driveUrl"&&f!=="driveTitle")render();
    return;
  }
  if(rid){
    var r=release(rid);if(!r)return;r[f]=v;save();
    if(f!=="note")render();return;
  }
  if(yid){
    var y=series(yid);if(!y)return;y[f]=v;save();
    if(f!=="note")render();return;
  }
  if(eid){
    var e=ep(eid);if(!e)return;
    if(f==="chars")e.chars=+v||0;
    else if(f==="isR18")e.isR18=!!v;
    else if(f==="date")e.scheduledAt=v?joinDT(v,tpart(e.scheduledAt)):null;
    else if(f==="time"){if(e.scheduledAt)e.scheduledAt=joinDT(dpart(e.scheduledAt),v||"19:00")}
    else e[f]=v;
    save();
    if(f==="date"||f==="time"||f==="isR18")render();
    return;
  }
});

render();
load();
})();
</script>
